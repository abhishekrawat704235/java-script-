      // how to convert javaScript object to JSON string and JSON string to JavaScript object
      // JSON.stringify() method is used to convert JavaScript object to JSON string

      console.log(JSON.stringify(product3)); //convert JavaScript object to JSON string
      // JSON.parse() method is used to convert JSON string to JavaScript object
      const jsonstring = JSON.stringify(product3); //store the JSON string in a variable
      console.log(JSON.parse(jsonstring));
